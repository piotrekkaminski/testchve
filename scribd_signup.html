      let uid = atob(base64EncodedUid);
      document.cookie = `fs_uid=${uid}; path=/; samesite=strict;`

    {
      console.log('Unable to maintain fullstory session continuity: unable to decode fs_uid')
    }
  })("", "")

<!-- Everand signup subtext -->
<script>
  
</script>

<!-- Behavior tag and header spacing -->
<script>
  const headerContainer = document.querySelector("header");

  
    const extraHeaderSpace = document.createElement("div");
    extraHeaderSpace.setAttribute("class", "extra-header-space")
    headerContainer.prepend(extraHeaderSpace);
  
</script>

<!-- Scribd specific styles -->
<script>
  
    const divider = document.querySelector("section > div > div > div > div:nth-child(3)");
    if (divider) {
      divider.classList.add("divider");
    }

    const password = document.querySelector("form > p > a");
    if (password) {
      password.classList.add("forgot-password");
    }
  
</script>

<!-- Alternate action section and Terms of Service -->
<script>
  const alternateActionsElements = document.querySelectorAll(".ulp-alternate-action");
  const alternateActionsContainer = alternateActionsElements[alternateActionsElements.length - 1];

  
</script>

<!-- Footer text and branding -->
<script>
  let footerImageText = null;
  let footerImage = null;

  
    footerImageText = document.createElement("p");
    footerImageText.innerHTML = `ONE SUBSCRIPTION FOR`;
    footerImageText.setAttribute("class", "footer-img-text");

    footerImage = document.createElement("img");
    footerImage.setAttribute("class", "footer-img");
    footerImage.setAttribute("alt", `One subscription for Scribd, Everand, and SlideShare` | "");
    
    
      footerImage.setAttribute("src", "https://s-f.scribdassets.com/images/auth0/scribd_all_brands_logo.svg")
    
  

  
    if (Boolean(alternateActionsContainer) && footerImageText && footerImage) {
      alternateActionsContainer.appendChild(footerImageText);
      alternateActionsContainer.appendChild(footerImage);
    }
  

  
</script>

</html>
